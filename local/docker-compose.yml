services:
  mailcatcher:
    image: schickling/mailcatcher
    ports:
      - "127.0.0.1:1081:1080"
      - "[::1]:1081:1080"
      - "127.0.0.1:1026:1025"
      - "[::1]:1026:1025"
    networks:
      - laravel

  app:
    build:
      context: .
      dockerfile: ./Dockerfile
    container_name: laravel_app
    volumes:
      - ..:/var/www
    depends_on:
      - db
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: laravel
      DB_USERNAME: laravel
      DB_PASSWORD: secret
    networks:
      - laravel

  web:
    image: nginx:alpine
    container_name: laravel_web
    ports:
      - "127.0.0.1:8080:80"
      - "[::1]:8080:80"
    volumes:
      - ..:/var/www
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - laravel

  db:
    image: mariadb:12.1.2-noble
    container_name: laravel_db
    environment:
      MYSQL_DATABASE: laravel
      MYSQL_USER: laravel
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "127.0.0.1:33060:3306"
      - "[::1]:33060:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - laravel

volumes:
  db_data:

networks:
  laravel:
    driver: bridge
